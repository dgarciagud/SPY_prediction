# =====================================================================
# REGISTRO DE HIPÓTESIS  ->  CARACTERÍSTICAS CANDIDATAS
# =====================================================================
# Regla de oro (tu propio argumento):
#   Si no puedes atar una característica a una hipótesis económica, no es
#   una candidata: es descubrimiento dirigido por datos y le cuesta al
#   presupuesto DSR. Toda candidata cuelga de una hipótesis aquí.
#
# Esto NO es la lista definitiva: es un punto de partida defendible para el
# dominio (predecir SPY con ETFs sectoriales + macro). PODA lo que no creas.
# Menos hipótesis fuertes > más candidatas tibias.
#
# Campos por hipótesis:
#   id          : identificador corto
#   rationale   : POR QUÉ debería predecir (mecanismo económico, no estadístico)
#   direction   : signo esperado del efecto (sanity check ex-ante)
#   features    : nombres de columnas candidatas que operacionalizan la hipótesis
#   horizon     : horizonte del efecto (informativo)
#   status      : active | parked | rejected
# =====================================================================

target:
  name: spy_tp_hit          # etiqueta triple-barrier (clasificación) o fwd_return (regresión)
  task: classification

meta:
  oos_start: "2023-01-01"   # bloque protegido, sellado hasta el gate final
  effective_labels_note: >
    Recuerda: ~890 labels efectivos para ~20 candidatas es señal/ruido pésima.
    El bootstrap de estabilidad importa más que el coeficiente.

hypotheses:

  - id: trend_persistence
    rationale: >
      El índice muestra autocorrelación positiva a medio plazo (momentum de
      series temporal). La tendencia reciente del propio SPY informa la
      siguiente barrera.
    direction: positive
    horizon: 20-60d
    status: active
    features:
      - spy_mom_63
      - spy_mom_252

  - id: short_term_reversal
    rationale: >
      A muy corto plazo domina la reversión (microestructura, sobre-reacción).
      Un empujón fuerte de 5d tiende a revertir parcialmente.
    direction: negative
    horizon: 5d
    status: active
    features:
      - spy_ret_5

  - id: volatility_regime
    rationale: >
      El régimen de volatilidad condiciona la probabilidad de tocar TP vs SL
      simétricos: en alta vol las barreras se tocan antes y cambia el balance.
    direction: context
    horizon: 20d
    status: active
    features:
      - spy_vol_20
      - spy_vol_ratio_20_60

  - id: cyclical_leadership
    rationale: >
      El liderazgo de sectores cíclicos (XLK, XLY, XLI) sobre defensivos
      (XLP, XLU, XLV) señala apetito por riesgo => sesgo alcista del índice.
    direction: positive
    horizon: 20d
    status: active
    features:
      - cyc_minus_def_mom_63
      - xlk_rs_spy_20

  - id: credit_risk_appetite
    rationale: >
      Financieras (XLF) lideran cuando mejora el apetito por crédito/curva;
      su fuerza relativa adelanta tramos alcistas del índice.
    direction: positive
    horizon: 20-60d
    status: active
    features:
      - xlf_rs_spy_20

  - id: energy_inflation_shock
    rationale: >
      Fuerza súbita de energía (XLE) suele coincidir con shocks de inflación
      /costes que presionan el múltiplo del índice.
    direction: negative
    horizon: 20d
    status: active
    features:
      - xle_rs_spy_20

  - id: breadth_dispersion
    rationale: >
      La dispersión cross-sectional entre sectores mide amplitud: baja
      dispersión con avance amplio es más sostenible que un avance estrecho.
    direction: context
    horizon: 20d
    status: active
    features:
      - sector_ret_dispersion_20
      - sector_mom_mean_63

  - id: term_structure_macro
    rationale: >
      La pendiente de la curva (10y-2y) anticipa el ciclo: inversión precede
      debilidad; empinamiento acompaña recuperaciones.
    direction: positive
    horizon: 60d+
    status: active
    features:
      - macro_yield_slope_10y2y

  - id: financial_conditions
    rationale: >
      Diferenciales de crédito (HY OAS) y el dólar resumen las condiciones
      financieras; su endurecimiento antecede caídas del índice.
    direction: negative
    horizon: 20-60d
    status: active
    features:
      - macro_hy_oas
      - macro_usd_broad_chg_20

  - id: risk_gauge
    rationale: >
      Un termómetro de miedo (nivel/variación de VIX) condiciona la asimetría
      de las barreras y el drift esperado.
    direction: negative
    horizon: 5-20d
    status: active
    features:
      - macro_vix_level
      - macro_vix_chg_5

# ---------------------------------------------------------------------
# Candidatas "en cuarentena": ideas sin mecanismo claro todavía.
# NO entran al pool de selección hasta que tengan rationale. Si no lo
# consigues, se quedan fuera: eso es el gate, no un cajón de sastre.
# ---------------------------------------------------------------------
parked:
  - name: spy_ret_20
    why_parked: >
      Solapa con mom_63 y ret_5; sin hipótesis propia distinta de trend/reversal.
  - name: xlb_rs_spy_20
    why_parked: >
      Materiales: mecanismo redundante con energía/cíclicos. Necesita tesis propia.

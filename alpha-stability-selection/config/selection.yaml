# Configuración del procedimiento de selección (= una variante DSR).
# Cambiar esto y volver a correr CUENTA como otra variante. No lo trates
# como hiperparámetros a barrer: fija tu procedimiento una vez.

task: classification            # classification | regression
n_bootstraps: 200
subsample_fraction: 0.5         # submuestreo sin reemplazo (ElasticNet, M&B)
stability_threshold: 0.80       # π: umbral de frecuencia de selección
max_features: 5                 # tope de parsimonia (si sobreviven más, recorta)
corr_threshold: 0.70            # de-correlación al recortar
aggregator: intersection        # intersection | union | elasticnet | tree

# ElasticNet (lente lineal)
l1_ratios: [0.3, 0.5, 0.7, 0.9]
en_coef_eps: 1.0e-6
en_cv: 5
en_max_iter: 5000

# Árboles poco profundos (lente no lineal)
tree_max_depth: 3               # 2-3
tree_importance_eps: 1.0e-6
tree_bootstrap_replace: true    # 200 bootstraps con reemplazo

random_state: 42
